[project]
name = "pyIPT"
version = "0.1.4"
authors = [
  { name="Jon Pye", email="jonpye@gmail.com" },
  { name="Mathew Biddle", email="mathew.biddle@noaa.gov" },
  { name="Stephen Formel", email="s.formel@obis.org" }
]
description = "A Python module for interacting with, registering, and publishing datasets to an Integrated Publishing Toolkit, using `requests`."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests",
  "requests_toolbelt",
  "bs4"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/iobis/pyIPT"
Issues = "https://github.com/iobis/pyIPT/issues"