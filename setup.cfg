[metadata]
name = pyIPT
version = attr: pyIPT.__version__
description = Python tools for publishing data to a GBIF IPT instance
long_description = file: README.md
long_description_content_type = text/markdown
license = CC-BY 4.0
license_file = LICENSE.md
url = https://github.com/iobis/pyIPT
classifiers =
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    Programming Language :: Python
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10

[options]
package_dir=
    =src
packages=find:

install_requires =
    requests
    bs4
tests_require =
    pytest
python_requires = >=3.7,<4

[options.packages.find]
where=src
exclude = tests

[flake8]
max-line-length = 100
per-file-ignores =
    *.py: E265 E501 E221 E203 E201 E124 E202 E241 E251 W293 W291 W504
    tests/*.py: F403 F405 E501
exclude =
    docs/
    src/*.py